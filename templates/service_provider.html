<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Signup </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100h;
        }

        .signup-container {
            background-color: white;
            padding-top: 35px;
            padding-right: 100px;
            padding-bottom: 35px;
            padding-left: 100px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 500px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .signup-container input[type="text"],
        .signup-container input[type="Email"],
        .signup-container input[type="Password"],
        .signup-container input[type="date"],
        .signup-container input[type="tel"],
        .signup-container input[type="decimal"]{
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .signup-container input[type="submit"] {
            width: 100%;
            background-color: blue;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .signup-container input[type="submit"]:hover {
            background-color: lightblue;
        }

        label {
            font-weight: bold;
        }

            .warning_msg {
            background-color: #f8d7da;
            margin-bottom: 6px;
            color: #721c24;
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            border-color: #f5c6cb;
        }

    </style>
</head>

<body>

    <div class="signup-container">
        <h2>Service Provider Signup</h2>
        <form action="/service_provider" method="POST">
            <!-- <div>{{ msg }}</div> -->
            {% if msg: %}
            <div class =warning_msg >{{ msg }}</div>
            {% endif %}
            <label for="First_Name">First Name</label>
            <input type="text" id="First_Name" name="First_Name" placeholder="Enter your First Name" required>

            <label for="Last_Name">Last Name</label>
            <input type="text" id="Last_Name" name="Last_Name" placeholder="Enter your Last Name" required>

            <label for="Email">Email</label>
            <input type="Email" id="Email" name="Email" placeholder="Enter your Email" required>

            <label for="Phone_Number">Phone Number</label>
            <input type="text" id="Phone_Number" name="Phone_Number" placeholder="Enter your Phone Number" required>

            <label for="City">City</label>
            <input type="text" id="City" name="City" placeholder="Enter your city" required>

            <label for="State">State</label>
            <input type="text" id="State" name="State" placeholder="Enter your State" required>

            <label for="Pincode">Pincode</label>
            <input type="text" id="Pincode" name="Pincode" placeholder="Enter your Pincode" pattern="[0-9]{6}"maxlength="6" required>

            <label for="Date_Of_Birth">Date Of Birth</label>
            <input type="date" id="Date_Of_Birth" name="Date_Of_Birth" placeholder="Enter Date Of Birth" required>

            <label for="Password">Password</label>
            <input type="password" id="Password" name="Password" placeholder="Enter your Password" required>

            <label for="confirm_Password">Confirm Password</label>
            <input type="password" id="confirm_Password" name="confirm_Password" placeholder="Re-enter Password" required>

            <label for="Category">Category</label>
            <input type="text" id="Category" name="Category" placeholder="Enter your Category" required>

            <label for="Base_Price">Base Price</label>
            <input type="decimal" id="Base_Price" name="Base_Price" placeholder="Enter your Base Price" required>

            <input type="submit" value="Sign Up">

        </form>
    </div>
</body>

</html>
