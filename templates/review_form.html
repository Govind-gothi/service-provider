{% extends "base.html" %}
{% block content %}
<style>
  .review-wrapper { display: flex; justify-content: center; font-family: sans-serif; padding: 40px 20px; }
  .review-box { width: 100%; max-width: 550px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
  .review-header { background: #ffc107; color: #333; padding: 25px; margin: 0; text-align: center; }
  .review-body { padding: 30px; }
  
  .booking-info { background: #fffcf0; border: 1px solid #ffeeba; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
  .booking-info p { margin: 8px 0; color: #555; }
  .booking-info strong { color: #333; }

  .form-group { margin-bottom: 25px; }
  .form-label { display: block; font-weight: bold; margin-bottom: 10px; color: #333; text-align: center; font-size: 1.1rem; }
  
  .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 10px; font-size: 2.5rem; }
  .star-rating input { display: none; }
  .star-label { cursor: pointer; color: #e4e5e9; transition: 0.2s; }
  .star-rating input:checked ~ .star-label,
  .star-label:hover,
  .star-label:hover ~ .star-label { color: #ffc107; }

  .text-area { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 120px; }
  .text-area:focus { border-color: #ffc107; outline: none; }
  
  .btn-submit { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; background: #ffc107; color: #333; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .btn-submit:hover { background: #e0a800; }
</style>

<div class="review-wrapper">
  <div class="review-box">
    <h2 class="review-header">⭐ Rate Your Experience</h2>
    
    <div class="review-body">
      <div class="booking-info">
        <p><strong>Provider:</strong> {{ booking.provider_name }}</p>
        <p><strong>Service:</strong> {{ booking.Service_Category }}</p>
        <p><strong>Date:</strong> {{ booking.Booking_Date }}</p>
      </div>

      <form method="POST">
        <div class="form-group">
          <label class="form-label">Your Rating</label>
          <div class="star-rating">
            {% for i in range(5, 0, -1) %}
            <input type="radio" id="star{{ i }}" name="rating" value="{{ i }}" required>
            <label for="star{{ i }}" class="star-label" title="{{ i }} stars">★</label>
            {% endfor %}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="review_text" style="text-align: left;">Write a Review (optional)</label>
          <textarea id="review_text" name="review_text" class="text-area" placeholder="Describe your experience..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Review</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
