<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top Center Search Bar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    /* Search Bar at Top Center */
    .search-wrapper {
      display: flex;
      justify-content: center;
      padding: 30px 20px 0 20px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
    }

    .search-input {
      flex: 1;
      padding: 14px 20px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    .search-input:focus {
      border-color: #0d6efd;
    }

    .search-button {
      padding: 8px 16px;
      font-size: 1rem;
      color: #0d6efd;
      background: transparent;
      border: 1px solid #0d6efd;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-button:hover {
      background: #0d6efd;
      color: white;
    }

    /* Card Layout */
    .flex-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .card {
      box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      max-width: 300px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #fff;
      border-radius: 8px;
      overflow: hidden;
      padding-bottom: 20px;
    }

    .title {
      color: grey;
      font-size: 18px;
      margin: 10px 0;
    }

    /* Fancy Button Style */
    .temp {
      align-items: center;
      background-image: linear-gradient(144deg, #af40ff, #5b42f3 50%, #00ddeb);
      border: 0;
      border-radius: 8px;
      box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
      color: #ffffff;
      display: flex;
      font-size: 18px;
      justify-content: center;
      line-height: 1em;
      max-width: 100%;
      min-width: 140px;
      padding: 3px;
      text-decoration: none;
      user-select: none;
      touch-action: manipulation;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s;
      margin: 10px auto 0 auto;
    }

    .temp:active,
    .temp:hover {
      outline: 0;
    }

    .temp span {
      background-color: rgb(5, 6, 45);
      padding: 16px 24px;
      border-radius: 6px;
      width: 100%;
      height: 100%;
      transition: 300ms;
    }

    .temp:hover span {
      background: none;
    }

    .temp:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- Search Bar -->
  <div class="search-wrapper">
    <form class="search-form" action="/services" method="POST"> 
      <input class="search-input" type="text" name="Category" placeholder="Search for services and packages" required>
      <button type="submit" class="search-button">Search</button>
    </form>
  </div>

  <!-- Cards Section -->
  <div class="flex-container">
    {% for res in results %}
    <div class="card">
      <img src="https://picsum.photos/seed/picsum/450/300" alt="Image" style="width:100%">
      <h1>{{ res.First_Name }}</h1>
      <p class="title">{{ res.Category.upper() }}</p>
      <p>Amount</p>
      <h2>₹{{ res.Base_Price }}</h2>
      <form action="/hire" method="GET">
        <button class="temp"><span>Hire</span></button>
      </form>
    </div>
    {% endfor %}
  </div>

</body>
</html>
