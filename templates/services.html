<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
        }

        /* Flex container for cards */
        .flex-container {
            display: flex;
            justify-content: center;
            /* Center cards horizontally */
            flex-wrap: wrap;
            /* Wrap to next line on small screens */
            gap: 20px;
            /* Space between cards */
            padding: 20px;
        }

        .button2 {
            background-color: white;
            border-radius: 6px;
            color: black;
            border: 2px solid #008CBA;
            padding: 4px 2px;
            text-align: center;
            text-decoration: none;
            display: inline;
            font-size: 16px;
            margin-left: 1px 2px;
            transition-duration: 0.5s;
            cursor: pointer;

        }

        .button2:hover {
            background-color: #008CBA;
            color: white;
        }

        .search-bar {
            margin: 10px;
            display: flex;
            justify-content: center;
        }

        input[type="text"] {
            width: 52%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        /* Card styles */
        .card {
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            max-width: 300px;
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }

        /* Title styling */
        .title {
            color: grey;
            font-size: 18px;
        }

        /* Button styling */
        button {
            border: none;
            outline: 0;
            display: inline-block;
            padding: 8px;
            color: white;
            background-color: #000;
            text-align: center;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
        }

        a {
            text-decoration: none;
            font-size: 22px;
            color: black;
        }

        button:hover,
        a:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <!-- Flex Container -->

    <form action="/services" method="POST">
        <div class="search-bar">
            <input type="text" name="Category" placeholder="Search for services and packages" required>
            <button class="button2">Search</button>
        </div>
    </form>
    <div class="flex-container">


        {%for res in results%}
        <div class="card">
            <img src="https://picsum.photos/seed/picsum/450/300" alt="John" style="width:100%">
            <h1>{{res.First_Name}}</h1>
            <p class="title">{{res.Category.upper()}}</p>
            <p>Amount</p>
            <div style="margin: 24px 0;">
                <a href="#"><i class="fa fa-dribbble"></i></a>
                <a href="#"><i class="fa fa-twitter"></i></a>
                <a href="#"><i class="fa fa-linkedin"></i></a>
                <a href="#"><i class="fa fa-facebook"></i></a>
            </div>
            <p><button>Contact</button></p>
        </div>

        {%endfor%}
    </div>

</body>

</html>
